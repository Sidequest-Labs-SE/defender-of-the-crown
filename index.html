<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Defender of the Crown - Amiga 1986 Tribute (Sprint 1)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
      color: #F4E4C1;
      user-select: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1A1A2E 0%, #000000 100%);
    }
    canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 10px rgba(74, 74, 82, 0.4);
      outline: 2px solid #4E2A14;
    }
    #amiga-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #bottom-bar {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #A8A8B2;
      text-transform: uppercase;
    }
    #bottom-bar span.key {
      color: #F2D06B;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="amiga-frame">
      <div id="phaser-canvas"></div>
      <div id="bottom-bar">
        [AMIGA 1986 OCS 320x200] &bull; Press <span class="key">C</span> or click CRT button to toggle scanlines
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
