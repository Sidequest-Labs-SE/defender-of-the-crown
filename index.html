<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Defender of the Crown - Amiga 1986 Modernized Remake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
      color: #F4E4C1;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1A1A2E 0%, #000000 100%);
      position: relative;
    }
    #phaser-canvas {
      width: 100vw;
      height: calc(100vh - 26px);
      max-width: 100vw;
      max-height: calc(100vh - 26px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95), 0 0 12px rgba(78, 42, 20, 0.6);
      border: 2px solid #4E2A14;
      border-radius: 4px;
    }
    #bottom-bar {
      height: 22px;
      line-height: 22px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #A8A8B2;
      text-transform: uppercase;
      text-align: center;
      z-index: 10;
    }
    #bottom-bar span.key {
      color: #F2D06B;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      #bottom-bar {
        font-size: 9px;
        height: 18px;
        line-height: 18px;
      }
      #phaser-canvas {
        height: calc(100vh - 20px);
        max-height: calc(100vh - 20px);
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="phaser-canvas"></div>
    <div id="bottom-bar">
      [AMIGA 1986 OCS 320x200] &bull; Press <span class="key">C</span> or tap <span class="key">CRT</span> to toggle filter
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
